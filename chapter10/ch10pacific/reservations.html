<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Trails Resort :: Reservations</title>
    <link rel="stylesheet" href="pacific.css">
</head>

<body>
    <div id="wrapper">
        <header>
            <h1>Pacific Trails Resort</h1>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="yurts.html">Yurts</a></li>
                <li><a href="activities.html">Activities</a></li>
                <li><a href="reservations.html">Reservations</a></li>
            </ul>
        </nav>

        <!-- Reservations hero image is set in pacific.css -->
        <div id="reservehero"></div>

        <main id="reservations">
            <h2>Reservations at Pacific Trails</h2>
            <h3>Contact Us Today!</h3>
            <p>Required fields are marked with an asterisk (*).</p>

            <form id="reservation-form"
                  method="post"
                  action="https://webdevbasics.net/scripts/pacific.php"
                  autocomplete="on">

                <label for="myFName">*First Name:</label>
                <input type="text"
                       id="myFName"
                       name="myFName"
                       autocomplete="given-name"
                       required>

                <label for="myLName">*Last Name:</label>
                <input type="text"
                       id="myLName"
                       name="myLName"
                       autocomplete="family-name"
                       required>

                <label for="myEmail">*E-mail:</label>
                <input type="email"
                       id="myEmail"
                       name="myEmail"
                       autocomplete="email"
                       required>

                <label for="myPhone">Phone:</label>
                <input type="tel"
                       id="myPhone"
                       name="myPhone"
                       autocomplete="tel">

                <label for="myArrival">Arrival Date:</label>
                <input type="date"
                       id="myArrival"
                       name="myArrival">

                <label for="myNights">Nights:</label>
                <input type="number"
                       id="myNights"
                       name="myNights"
                       min="1"
                       max="14">

                <label for="myComments">*Comments:</label>
                <textarea id="myComments"
                          name="myComments"
                          rows="4"
                          cols="30"
                          required></textarea>

                <input type="submit"
                       id="mySubmit"
                       value="Submit">
            </form>
        </main>

        <footer>
            <p>
                Copyright &copy; 2026 Pacific Trails Resort<br>
                <a href="mailto:dh1162354@swccd.edu">Dahlia Haidar</a>
            </p>
        </footer>
    </div>
</body>
</html>
